name: Dashboard rendern

# GitHub runs scheduled workflows unreliably (in practice only every ~7-8 hours here).
# So one run keeps itself alive for ~5.5 hours, renders every 15 minutes, and then
# starts its own successor via workflow_dispatch (allowed with GITHUB_TOKEN).
# Each new trigger simply replaces the running loop. The images are force-pushed to
# the "gh-pages" branch (a single commit, no growing history), which GitHub Pages serves.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["config.json", "render/**", ".github/workflows/**"]

permissions:
  contents: write
  actions: write     # to start the next run when this one ends

concurrency:
  group: render-loop
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: render/requirements.txt

      - run: pip install -r render/requirements.txt

      # GitHub pauses scheduled workflows after 60 days without a commit on the default branch.
      - name: Keep-alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "dashboard-bot"
            git config user.email "dashboard-bot@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive"
            git push
          fi

      - name: Rendern und veröffentlichen (alle 15 min, ~5 h 50 min lang)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          end=$(( SECONDS + 5*3600 + 30*60 ))
          while :; do
            rm -rf site && mkdir site
            if (cd render && python landscape.py --outdir ../site); then
              date -u +%s > site/timestamp.txt
              cp render/index.html site/index.html
              touch site/.nojekyll
              (
                cd site
                git init -q -b gh-pages
                git config user.name "dashboard-bot"
                git config user.email "dashboard-bot@users.noreply.github.com"
                git add -A
                git commit -q -m "Dashboard $(date -u +%FT%TZ)"
                git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
              ) && echo "veröffentlicht $(date -u +%T)" || echo "::warning::Veröffentlichen fehlgeschlagen"
            else
              echo "::warning::Rendern fehlgeschlagen"
            fi
            [ $SECONDS -ge $end ] && break
            sleep 900
          done

      - name: Nächsten Lauf starten
        if: success()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          curl -fsS -X POST             -H "Authorization: Bearer ${TOKEN}"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/${REPO}/actions/workflows/dashboard.yml/dispatches"             -d '{"ref":"main"}'
          echo "Nachfolger gestartet"
