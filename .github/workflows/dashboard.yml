name: Dashboard rendern

on:
  schedule:
    - cron: "*/30 * * * *"   # alle 30 Minuten (GitHub kann ein paar Minuten verzögern)
  workflow_dispatch: {}        # manuell starten: Actions -> "Dashboard rendern" -> Run workflow
  push:
    branches: [main]
    paths: ["config.json", "render/**", ".github/workflows/**"]

permissions:
  contents: write   # nur für den monatlichen Keep-alive-Commit
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: render/requirements.txt

      - run: pip install -r render/requirements.txt

      - name: Bild erzeugen
        run: |
          python render/dashboard.py --out site/dashboard.png
          date -u +%s > site/timestamp.txt
          cp render/index.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub pausiert zeitgesteuerte Workflows nach 60 Tagen ohne Commit.
      # Einmal im Monat (am 1., erster Lauf nach Mitternacht UTC) ein leerer Commit hält ihn am Leben.
      - name: Keep-alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0100" ] && [ "$(date -u +%M)" -lt 30 ]; then
            git config user.name "dashboard-bot"
            git config user.email "dashboard-bot@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive"
            git push
          fi
