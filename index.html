<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="900">
<title>Kindle Dashboard</title>
<style>
  :root { --bg: #f4f4f2; --fg: #1a1a1a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1b; --fg: #eee; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; text-align: center; }
  img { width: 100%; height: auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 12px #0003; }
</style>
</head>
<body>
<main>
  <img src="dashboard.png" alt="Dashboard">
  <p>Diese Seite lädt der Kindle als <code>dashboard.png</code>.</p>
</main>
</body>
</html>
